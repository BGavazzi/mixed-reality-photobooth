[pytest]
# Scoped to tests/ on purpose. The repo root holds operator scripts --
# send_trigger.py, verify_web_ui.py, verify_multi_session.py and friends --
# that parse argv and drive real servers at import time. Several were once
# named test_*.py, so a bare `pytest` collected them, executed their module
# bodies, and failed trying to reach a ComfyUI instance that wasn't running.
# See tests/README.md for the split between the two kinds of check.
testpaths = tests
addopts = -q --strict-markers
