name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Ubuntu even though both apps target Windows (Spout is Windows-only):
    # nothing in tests/ touches Spout, and the point of the offline suite is
    # that the pipeline logic is portable and doesn't need the demo rig.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README claims; 3.12 is what the dev machine runs.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run the offline suite
        run: pytest

      - name: Check every module imports cleanly
        # Catches the import-time breakage unit tests can miss: a syntax
        # error in an entry point, or a module-scope side effect that only
        # works on the dev machine.
        run: |
          python -c "import bridge, web_server, photoshoot_pipeline, resolume_state, spout_output, console_encoding"
          python -c "import backends; print(sorted(backends.BACKENDS))"
